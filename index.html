<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXON 3D AR | Spatial Engine</title>

    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #030305;
        --accent: #00f2ff;
        --glass: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .bg-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 50%, #111, #030305);
      }

      /* SOLUTION: LinkedIn button moved to TOP NAV */
      nav {
        padding: 20px 6%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 2px;
      }
      .logo span {
        color: var(--accent);
      }

      .li-nav-btn {
        background: #0a66c2;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 50px;
        font-size: 12px;
        font-weight: 700;
        transition: 0.3s;
      }

      /* Layout Container */
      .main-container {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 30px;
        max-width: 1500px;
        margin: 30px auto;
        padding: 0 5%;
        height: 70vh;
        align-items: center;
      }

      .viewer-box {
        height: 100%;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 40px;
        overflow: hidden;
        backdrop-filter: blur(20px);
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .metric-card {
        background: var(--glass);
        border: 1px solid var(--border);
        padding: 25px;
        border-radius: 35px;
        display: flex;
        justify-content: space-around;
      }
      .metric-card div {
        text-align: center;
      }
      .metric-card h3 {
        font-size: 1.6rem;
        color: var(--accent);
        font-weight: 800;
      }
      .metric-card p {
        font-size: 0.55rem;
        opacity: 0.4;
        letter-spacing: 1px;
      }

      /* BIG CLEAN BUTTON AREA */
      .action-hub {
        background: #ffffff;
        color: #000;
        padding: 40px;
        border-radius: 40px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .action-hub h4 {
        font-size: 0.7rem;
        letter-spacing: 2px;
        margin-bottom: 20px;
        opacity: 0.6;
      }
      .action-hub img {
        width: 170px;
        height: 170px;
        margin-bottom: 20px;
        border-radius: 15px;
      }

      .ar-primary-btn {
        width: 100%;
        background: #000;
        color: #fff;
        border: none;
        padding: 20px;
        border-radius: 100px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
      }

      /* Mobile Fixes */
      @media (max-width: 1100px) {
        .main-container {
          grid-template-columns: 1fr;
          height: auto;
          padding-bottom: 50px;
        }
        .viewer-box {
          height: 400px;
        }
        .logo {
          font-size: 0.8rem;
        }
        .li-nav-btn {
          padding: 8px 15px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>

    <nav>
      <div class="logo">NEXON <span>3D AR</span></div>
      <a
        href="https://www.linkedin.com/in/3d-ar-nexon-solution-1226323b3"
        target="_blank"
        class="li-nav-btn"
      >
        LINKEDIN
      </a>
    </nav>

    <main class="main-container">
      <div class="viewer-box">
        <model-viewer
          src="sofa.glb"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          auto-rotate
          shadow-intensity="1.5"
          exposure="1"
          ar-scale="fixed"
          scale="1.5 1.5 1.5"
          camera-orbit="45deg 75deg 105%"
          environment-image="neutral"
        >
          <button
            slot="ar-button"
            id="ar-main-go"
            style="display: none"
          ></button>
        </model-viewer>
      </div>

      <div class="sidebar">
        <div class="metric-card">
          <div>
            <h3>94%</h3>
            <p>CONFIDENCE</p>
          </div>
          <div>
            <h3>-47%</h3>
            <p>RETURNS</p>
          </div>
        </div>

        <div class="action-hub">
          <h4>SCAN FOR AR VIEW</h4>
          <img src="qr.png" alt="AR QR Code" />
          <button
            class="ar-primary-btn"
            onclick="document.querySelector('#ar-main-go').click()"
          >
            VIEW IN YOUR ROOM
          </button>
        </div>
      </div>
    </main>

    <div
      style="
        text-align: center;
        opacity: 0.2;
        font-size: 9px;
        padding: 20px;
        letter-spacing: 2px;
      "
    >
      SPATIAL ENGINE 2.0 | RAIPUR HQ
    </div>
  </body>
</html>
