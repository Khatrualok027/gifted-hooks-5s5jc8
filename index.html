<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXON 3D AR | Spatial Engine</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #030305;
            --accent: #00f2ff;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Plus Jakarta Sans", sans-serif; background:var(--bg); color:white; min-height:100vh; overflow-x:hidden; }

        @keyframes neon-pulse { 
            0%,100%{border-color:var(--border); box-shadow:0 0 5px transparent;} 
            50%{border-color:var(--accent); box-shadow:0 0 15px rgba(0,242,255,0.2);} 
        }

        .bg-glow { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background:radial-gradient(circle at 50% 50%, #111, #030305);}

        nav { padding:20px 6%; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); backdrop-filter: blur(10px);}
        .logo { font-weight:800; font-size:1.1rem; letter-spacing:2px;} 
        .logo span { color:var(--accent);}

        .main-container { display:grid; grid-template-columns:1.2fr 0.8fr; gap:30px; max-width:1600px; margin:30px auto; padding:0 5%; height:75vh; align-items:center; }

        .viewer-box { height:100%; background:var(--glass); border:1px solid var(--border); border-radius:40px; overflow:hidden; backdrop-filter:blur(20px); animation: neon-pulse 4s infinite ease-in-out; }
        model-viewer { width:100%; height:100%; }

        .sidebar { display:flex; flex-direction:column; gap:20px; }
        .metric-card { background: var(--glass); border:1px solid var(--border); padding:25px; border-radius:35px; display:flex; justify-content:space-around; animation:neon-pulse 4s infinite ease-in-out; }
        .metric-card h3 { font-size:1.8rem; color:var(--accent); font-weight:800; }
        .metric-card p { font-size:0.6rem; opacity:0.4; letter-spacing:1px; }

        .action-hub { background:#ffffff; color:#000; padding:40px; border-radius:45px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5); animation: neon-pulse 4s infinite ease-in-out; }
        .action-hub h4 { font-size:0.7rem; font-weight:800; margin-bottom:20px; letter-spacing:2px; opacity:0.7; }
        .action-hub img { width:180px; height:180px; margin-bottom:20px; border-radius:20px; border:1px solid #eee; padding:10px; }

        .ar-primary-btn { width:100%; background:#000; color:#fff; border:none; padding:22px; border-radius:100px; font-weight:800; font-size:1.1rem; cursor:pointer; transition:0.3s; }
        .ar-primary-btn:hover { background: #333; }
        .ar-primary-btn:active { transform:scale(0.95); }

        .footer-wrap { position:fixed; bottom:30px; right:5%; left:5%; display:flex; justify-content:flex-end; align-items:center; gap:25px; }
        .li-btn { background:#0a66c2; color:white; text-decoration:none; padding:14px 28px; border-radius:100px; font-size:12px; font-weight:800; animation: neon-pulse 4s infinite ease-in-out; }

        @media (max-width:1100px){ 
            .main-container{grid-template-columns:1fr;height:auto;padding-bottom:120px;} 
            .viewer-box{height:350px;} 
            .footer-wrap{justify-content:center;bottom:20px;} 
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <nav>
        <div class="logo">NEXON <span>3D AR</span></div>
        <div style="font-size:9px;opacity:0.3;letter-spacing:2px">VIRTUAL RETAIL LABS</div>
    </nav>

    <main class="main-container">
        <div class="viewer-box">
            <model-viewer
                id="sofaModel"
                src="sofa.glb"
                camera-controls
                auto-rotate
                ar
                ar-modes="webxr scene-viewer quick-look"
                environment-image="neutral"
                shadow-intensity="1.5"
                interaction-prompt="auto"
                ar-placement="floor">
            </model-viewer>
        </div>

        <div class="sidebar">
            <div class="metric-card">
                <div><h3>94%</h3><p>CONFIDENCE</p></div>
                <div><h3>-47%</h3><p>RETURNS</p></div>
            </div>

            <div class="action-hub">
                <h4>EXPERIENCE IN 3D</h4>
                <img src="qr.png" alt="AR QR" />
                <button class="ar-primary-btn" onclick="startNexonAR()">VIEW IN AR</button>
            </div>
        </div>
    </main>

    <div class="footer-wrap">
        <a href="https://www.linkedin.com/in/3d-ar-nexon-solution-1226323b3" target="_blank" class="li-btn">CONNECT ON LINKEDIN</a>
    </div>

    <script>
        function startNexonAR() {
            // Mobile check logic
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const arURL = "https://mywebar.com/p/Project_1_ef5ijwttze";

            if (isMobile) {
                // Agar mobile hai toh redirect karo
                window.location.href = arURL;
            } else {
                // Agar desktop hai toh alert dikhao
                alert("NEXON 3D : AR mode is for mobile only. Please scan the QR code with your phone camera!");
            }
        }
    </script>
</body>
</html>
