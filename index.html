<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXON 3D AR | Professional Spatial Engine</title>

    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #030305;
        --accent: #00f2ff;
        --glass: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: white;
        overflow: hidden;
      }

      .bg-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 50%, #111, #030305);
      }

      nav {
        padding: 30px 6%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-weight: 800;
        font-size: 1.2rem;
        letter-spacing: 2px;
      }
      .logo span {
        color: var(--accent);
      }

      /* Main Grid */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 40px;
        max-width: 1600px;
        margin: 0 auto;
        padding: 0 6%;
        height: 75vh;
        align-items: center;
      }

      /* 3D Viewer Area - Bilkul Clean */
      .viewer-card {
        height: 100%;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 50px;
        overflow: hidden;
        position: relative;
        backdrop-filter: blur(40px);
        animation: borderPulse 4s infinite ease-in-out;
      }

      @keyframes borderPulse {
        0%,
        100% {
          border-color: var(--border);
        }
        50% {
          border-color: var(--accent);
          box-shadow: 0 0 20px rgba(0, 242, 255, 0.05);
        }
      }

      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      /* Right Panel */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .stats-card {
        background: var(--glass);
        border: 1px solid var(--border);
        padding: 30px;
        border-radius: 40px;
        display: flex;
        justify-content: space-around;
      }
      .stats-card h3 {
        font-size: 1.8rem;
        color: var(--accent);
        font-weight: 800;
      }
      .stats-card p {
        font-size: 0.6rem;
        opacity: 0.4;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* QR Hub */
      .action-hub {
        background: #ffffff;
        color: #000;
        padding: 45px;
        border-radius: 50px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .action-hub img {
        width: 200px;
        height: 200px;
        margin-bottom: 25px;
        border-radius: 20px;
        border: 1px solid #eee;
      }

      .ar-btn {
        width: 100%;
        background: #000;
        color: #fff;
        border: none;
        padding: 22px;
        border-radius: 100px;
        font-weight: 900;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        letter-spacing: 1px;
      }
      .ar-btn:hover {
        background: #333;
        transform: scale(1.02);
      }

      /* Connect Link */
      .li-fixed {
        position: fixed;
        bottom: 35px;
        right: 45px;
        background: #0a66c2;
        padding: 15px 30px;
        border-radius: 100px;
        text-decoration: none;
        color: white;
        font-weight: 700;
        font-size: 14px;
      }

      @media (max-width: 1100px) {
        .main-grid {
          grid-template-columns: 1fr;
          height: auto;
          padding-bottom: 150px;
        }
        .viewer-card {
          height: 450px;
        }
        body {
          overflow-y: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>

    <nav>
      <div class="logo">NEXON <span>3D AR</span></div>
      <div style="font-size: 10px; opacity: 0.3; letter-spacing: 2px">
        SPATIAL ENGINE 2.0
      </div>
    </nav>

    <main class="main-grid">
      <div class="viewer-card">
        <model-viewer
          id="nexon-v"
          src="sofa.glb"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          auto-rotate
          shadow-intensity="2"
          exposure="1"
          ar-scale="fixed"
          scale="1.5 1.5 1.5"
          camera-orbit="45deg 75deg 105%"
          environment-image="neutral"
          loading="eager"
        >
          <button slot="ar-button" id="ar-go" style="display: none"></button>
        </model-viewer>
      </div>

      <div class="sidebar">
        <div class="stats-card">
          <div>
            <h3>94%</h3>
            <p>CONFIDENCE</p>
          </div>
          <div>
            <h3>-47%</h3>
            <p>RETURNS</p>
          </div>
        </div>

        <div class="action-hub">
          <p
            style="
              font-size: 0.7rem;
              font-weight: 800;
              margin-bottom: 20px;
              letter-spacing: 2px;
            "
          >
            ACTIVATE SPATIAL VIEW
          </p>
          <img src="qr.png" alt="AR QR" />
          <button
            class="ar-btn"
            onclick="document.querySelector('#ar-go').click()"
          >
            VIEW IN AR
          </button>
        </div>
      </div>
    </main>

    <a
      href="https://www.linkedin.com/in/3d-ar-nexon-solution-1226323b3"
      target="_blank"
      class="li-fixed"
    >
      CONNECT ON LINKEDIN
    </a>
  </body>
</html>
